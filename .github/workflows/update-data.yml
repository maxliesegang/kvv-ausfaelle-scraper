name: Update KVV cancellations

on:
  schedule:
    - cron: '0 */4 * * *' # run at 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 (UTC)
  workflow_dispatch: {}

# Allow only one publish at a time; let an in-progress run finish so we never
# cancel a scrape mid-flight (runs are 4h apart, so overlap is unlikely anyway).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit/push docs/
      pages: write # deploy to GitHub Pages
      id-token: write # OIDC token for deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Run scraper
        id: scraper
        continue-on-error: true
        run: npm start

      # Back-verify departed trips against bahn.expert's realtime feed and stamp the advisory
      # `verification` field. Runs before formatting/commit so verdicts ship with the same commit.
      # Deliberately isolated from the scraper: it is a third-party dependency with no SLA, it
      # never mutates trip identity, and `continue-on-error` keeps an outage there from touching
      # the publishing path. The feed answers for ~6 days, so a skipped run self-heals later.
      - name: Back-verify departed trips
        if: always()
        continue-on-error: true
        run: npm run verify-trips -- --write

      - name: Format generated files
        if: always()
        run: npm run format

      - name: Commit and push changes
        if: always()
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            # Commit only the site content under docs/ (single source of truth for Pages)
            git add docs
            git commit -m "Update KVV cancellations (docs)"
            git push
          else
            echo "No changes"
          fi

      # Publish docs/ to GitHub Pages. !cancelled() runs even when the scraper
      # reported errors so the good data committed above still goes live; only a
      # cancelled run skips publishing.
      - name: Configure Pages
        if: ${{ !cancelled() }}
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deploy
        if: ${{ !cancelled() }}
        uses: actions/deploy-pages@v5

      # The corpus audits (tests/unit/archive-corpus.test.ts, archive-relevance.test.ts) read
      # docs/, so an article archived by the run above can turn them red with no code change —
      # a class of regression the CI workflow, which only sees commits it is triggered by, can
      # report only after the fact. Run them here, after the data is committed and published,
      # so the good data still goes live and the failure lands on the run that produced it.
      - name: Audit the committed data
        if: ${{ !cancelled() }}
        run: npm test

      - name: Fail if scraper had errors
        if: steps.scraper.outcome == 'failure'
        run: |
          echo "Scraper exited non-zero (parse errors or unclassified 'unknown' causes)."
          echo "Data was still committed above; check logs for affected articles."
          exit 1
